<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel da Secretaria</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=2)}" />
  </head>
  <body>
    <div th:replace="~{fragments :: navbar('fixa', 'painel')}"></div>

    <section class="faixa-escura" style="min-height: 90vh">
      <div class="container">
        <h1 class="titulo-pagina">Painel da Secretaria</h1>

        <div class="grid-tiles">
          <div class="tile tile-marrom">
            <div class="tile-numero" th:text="${total}">0</div>
            <h3>Total de demandas</h3>
          </div>
          <div class="tile tile-bege">
            <div class="tile-numero" th:text="${pendentes}">0</div>
            <h3>Pendentes</h3>
          </div>
          <div class="tile tile-verde">
            <div class="tile-numero" th:text="${concluidas}">0</div>
            <h3>Concluídas</h3>
          </div>
        </div>

        <div class="card tabela-wrapper">
          <table class="tabela">
            <thead>
              <tr>
                <th>Protocolo</th>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Comunidade</th>
                <th>Necessidade</th>
                <th>Status</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="demanda : ${demandas}">
                <td class="protocolo" th:text="${demanda.protocolo}"></td>
                <td th:text="${demanda.nomeSolicitante}"></td>
                <td th:text="${demanda.telefone}"></td>
                <td>
                  <span
                    class="badge badge-comunidade"
                    th:text="${demanda.comunidade}"
                  ></span>
                </td>
                <td th:text="${demanda.tipoServico}"></td>
                <td>
                  <span
                    th:if="${demanda.status.name() == 'PENDENTE'}"
                    class="badge badge-pendente"
                    th:text="${demanda.status.descricao}"
                  ></span>
                  <span
                    th:if="${demanda.status.name() == 'EM_ATENDIMENTO'}"
                    class="badge badge-em-atendimento"
                    th:text="${demanda.status.descricao}"
                  ></span>
                  <span
                    th:if="${demanda.status.name() == 'CONCLUIDO'}"
                    class="badge badge-concluida"
                    th:text="${demanda.status.descricao}"
                  ></span>
                </td>
                <td class="text-center">
                  <form
                    th:if="${demanda.status.name() != 'CONCLUIDO'}"
                    th:action="@{/secretaria/atualizar-status}"
                    method="post"
                  >
                    <input type="hidden" name="id" th:value="${demanda.id}" />
                    <select name="status" class="status-select">
                      <option
                        th:each="status : ${T(com.agrodemanda.model.StatusDemanda).values()}"
                        th:value="${status.name()}"
                        th:text="${status.descricao}"
                        th:selected="${status.name() == demanda.status.name()}"
                      ></option>
                    </select>
                    <button type="submit" class="btn btn-primario btn-sm">
                      Atualizar
                    </button>
                  </form>
                  <small th:if="${demanda.status.name() == 'CONCLUIDO'}"
                    >Finalizado</small
                  >
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(demandas)}">
                <td colspan="7" class="tabela-vazia">
                  Nenhuma demanda registrada ainda.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <footer class="footer">AgroDemanda · Secretaria de Agricultura</footer>
  </body>
</html>
