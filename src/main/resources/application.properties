spring.application.name=agrodemanda

# Porta da aplicacao (8081 para evitar conflito com a 8080)
server.port=8081

# Banco de dados H2 em memoria
spring.datasource.url=jdbc:h2:mem:agrodemandadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicializacao de dados (data.sql apos criar tabelas)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
