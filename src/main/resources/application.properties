# BLOCO 2: CONFIGURACOES DA APLICACAO E DO BANCO DE DADOS
# Responsavel: Pedro Henrique

spring.application.name=agrodemanda

# Porta de comunicacao da aplicacao (definida como 8081 para nao conflitar com a 8080)
server.port=8081

# Banco de dados H2 em memoria RAM (nao precisa instalar nenhum programa externo)
spring.datasource.url=jdbc:h2:mem:agrodemandadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o console visual do H2 no navegador para inspecionar as tabelas em /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate JPA: cria e atualiza a estrutura da tabela tb_demandas automaticamente
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Exibe as consultas SQL reais no terminal do VS Code
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Executa o script data.sql logo apos o Hibernate criar a tabela no banco
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
